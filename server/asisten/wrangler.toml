# Konfigurasi Cloudflare Worker untuk Asisten Belajar "Kak Bulat".
# API key TIDAK ditulis di sini — pasang dengan: npx wrangler secret put API_KEY
name = "lingkarku-asisten"
main = "index.ts"
compatibility_date = "2025-09-01"

[vars]
# Penyedia AI: "deepseek" (berbayar murah), "openrouter" (ada model gratis), "gemini" (Google, ada kuota gratis)
PENYEDIA = "openrouter"
# Model gratis OpenRouter (50 pesan/hari). Beberapa model dipisah koma: yang pertama dicoba dulu,
# bila sedang penuh (429) server otomatis mencoba model berikutnya.
# Untuk beralih ke DeepSeek:
#   - via OpenRouter (berbayar murah): MODEL = "~deepseek/deepseek-flash-latest"
#   - DeepSeek resmi: PENYEDIA = "deepseek", MODEL = "" (pakai API key DeepSeek)
MODEL = "google/gemma-4-31b-it:free,google/gemma-4-26b-a4b-it:free,nvidia/nemotron-3-ultra-550b-a55b:free,baidu/ernie-5.5-flash-preview:free,openrouter/free"
# ASAL_DIIZINKAN = "https://contoh-domain-lain.id"

# Pembatas laju: maks. 20 pesan per menit per alamat IP (melindungi saldo API).
[[ratelimits]]
name = "PEMBATAS"
namespace_id = "1001"
simple = { limit = 20, period = 60 }
